name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GOARCH: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: go test ./...
      - name: Build DMG and ZIP
        run: npm run build
      - name: Generate download checksums
        working-directory: build
        run: shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo "This version is already published. Bump the version to publish another release." >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "Weave $GITHUB_REF_NAME" --generate-notes \
              --notes-file .github/RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" build/*.dmg build/*.zip build/SHA256SUMS.txt --clobber
          flags=(--latest)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags=(--prerelease --latest=false)
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false "${flags[@]}"
