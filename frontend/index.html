<!doctype html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title data-i18n="weaveResourceLibrary">Weave · 资源库</title><link rel="icon" type="image/png" href="app-icon.png"><link id="__media-styles" rel="stylesheet" href="vendor/videojs/global.css"><link rel="stylesheet" href="style.css"></head><body>
<header class="window-titlebar"><div class="titlebar-controls"><div class="history-controls" role="group" aria-label="页面导航" data-i18n-aria-label="pageNavigation"><button id="navigateBack" class="icon" aria-label="后退" aria-keyshortcuts="Meta+[" title="后退 ⌘ [" data-icon="arrowLeft" disabled data-i18n-aria-label="back" data-i18n-title="backLabel"></button><button id="navigateForward" class="icon" aria-label="前进" aria-keyshortcuts="Meta+]" title="前进 ⌘ ]" data-icon="arrowRight" disabled data-i18n-aria-label="forward" data-i18n-title="forwardLabel"></button></div><button id="toggleSidebar" class="icon" type="button" data-icon="sidebar" aria-controls="sidebar" aria-expanded="true" aria-label="收起侧栏" title="收起侧栏" aria-keyshortcuts="Meta+\ Control+\"></button></div>

<div class="side-bottom"><button id="refresh" data-icon="refresh" data-i18n-title="rescanLabel" data-i18n-aria-label="rescanLabel"></button><button id="settingsButton" data-icon="settings" data-i18n-title="settings" data-i18n-aria-label="settings" aria-keyshortcuts="Meta+,"></button></div></aside>
<div id="sidebarShade"></div>

<div class="sidebar-inner">
<div class="sidebar-tools"><span class="brand">Weave</span><button id="sourceSearch" class="icon" data-icon="search" aria-controls="commandPalette" aria-haspopup="dialog" aria-expanded="false" aria-keyshortcuts="Meta+K Control+K" data-i18n-title="commandPalette" data-i18n-aria-label="commandPalette"></button></div>

<button id="newSource"><i data-icon="add"></i><span data-i18n="newSource">新建来源</span></button>
<div class="source-scroll">

<section class="source-section" aria-labelledby="sourcesHeading"><h2 id="sourcesHeading" data-i18n="resourceDirectories">资源目录</h2><div id="sourceRows"></div></section>
<details id="recentSources" class="source-section" open><summary><i data-icon="chevron"></i><span data-i18n="recentSources">最近打开</span></summary><div id="recentSourceRows"></div></details>
</div>
<section class="storage-section">
 <div class="storage-heading">
  <button id="toggleStorage" type="button" aria-expanded="false" aria-controls="storageDetails">
   <i data-icon="drive"></i><span data-i18n="currentSourceUsage">当前目录用量</span>

</div></aside>
<div id="sourceInfo" class="source-info" hidden></div>
<main>

<summary id="timelineDateButton"><i data-icon="calendar"></i><span></span></summary>
<div class="timeline-date-panel">

  <button type="button" data-range-days="7" data-i18n="timelineLast7Days">最近 7 天</button>
  <button type="button" data-range-months="1" data-i18n="timelineLastMonth">最近 1 个月</button>
  <button type="button" data-range-months="3" data-i18n="timelineLast3Months">最近 3 个月</button>
  <button type="button" data-range-months="6" data-i18n="timelineLast6Months">最近半年</button>
 </div>
 <div class="timeline-calendar">
  <button type="button" class="icon" id="timelinePreviousMonth" data-i18n-aria-label="timelinePreviousMonth"><i data-icon="back"></i></button>

  <button type="button" class="icon" id="timelineNextMonth" data-i18n-aria-label="timelineNextMonth"><i data-icon="chevron"></i></button>

</div>
</details><button id="tagFilterButton" type="button" aria-controls="tagFilterPanel" aria-expanded="false"><i data-icon="tag" aria-hidden="true"></i><span data-i18n="filterTags">筛选标签</span><span class="tag-filter-dot"></span></button><div class="view-controls"><button id="gridView" class="icon active" title="网格视图" aria-label="网格视图" data-icon="grid" data-i18n-title="gridView" data-i18n-aria-label="gridView"></button><button id="listView" class="icon" title="列表视图" aria-label="列表视图" data-icon="list" data-i18n-title="listView" data-i18n-aria-label="listView"></button></div></div><div id="scopeFilters" class="scope-filters" role="group" aria-label="会话资源类型，可多选" hidden data-i18n-aria-label="conversationResourceTypesMultipleSelection"><button data-scope-kind="" aria-pressed="true" data-i18n="allTypes">全部类型</button><button data-scope-kind="image" aria-pressed="false" data-i18n="images">图片</button><button data-scope-kind="video" aria-pressed="false" data-i18n="videos">视频</button><button data-scope-kind="audio" aria-pressed="false" data-i18n="audio">音频</button><button data-scope-kind="document" aria-pressed="false" data-i18n="documents">文档</button><button data-scope-kind="other" aria-pressed="false" data-i18n="other">其他</button><span data-i18n="multipleSelection">可多选</span></div></div>
<div class="library-results">

 <div class="timeline-node-preview" aria-hidden="true"><strong></strong><span></span></div>
</nav>
<div class="resources-scroll" id="resourceScroll"><section id="catalogLoading" aria-labelledby="catalogLoadingTitle" hidden><div class="catalog-loading-content">
 <div id="catalogLoadingMark" aria-hidden="true"></div>
 <h2 id="catalogLoadingTitle" data-i18n="buildingResourceIndex">正在建立资源索引</h2>

 <div class="directory-progress" aria-hidden="true"></div>
</div></section><div id="notice" role="status"></div><div id="items" aria-live="polite"></div><section id="empty" aria-labelledby="emptyTitle" hidden><div class="empty-content">
<svg class="empty-art" viewBox="0 0 112 96" fill="none" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round">

 <path class="empty-art-tray" d="M24 53h16l6 9h20l6-9h16a6 6 0 0 1 6 6v15a8 8 0 0 1-8 8H26a8 8 0 0 1-8-8V59a6 6 0 0 1 6-6Z"/>

<dialog id="commandPalette" aria-label="命令面板" data-i18n-aria-label="commandPalette">
 <div class="command-input">
  <input id="commandQuery" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="commandResults" autocomplete="off" spellcheck="false" autofocus>
  <button id="closeCommands" type="button" data-i18n-aria-label="closeCommandPalette"><kbd>Esc</kbd></button>
 </div>
 <div class="command-scroll">
  <div id="commandResults" role="listbox" data-i18n-aria-label="commandResults"></div>
  <div id="commandStatus" role="status" aria-live="polite"></div>
 </div>
 <div class="command-footer">
  <div id="commandCategories" role="group" data-i18n-aria-label="resourceCategories">
   <button type="button" data-category="all" data-i18n="commandAll">全部</button>
   <button type="button" data-category="actions" data-i18n="commandActions">操作</button>
   <button type="button" data-category="locations" data-i18n="commandLocations">位置</button>
   <button type="button" data-category="files" data-i18n="commandFiles">文件</button>
  </div>
  <div class="command-keys" aria-hidden="true"><span><kbd>↑</kbd><kbd>↓</kbd> <span data-i18n="commandMove">移动</span></span><span><kbd>↵</kbd> <span data-i18n="commandRun">打开</span></span></div>
 </div>
</dialog>

<div id="tagFilterPanel" class="resource-popover" popover="auto" role="group" aria-labelledby="tagFilterButton"></div>
<dialog id="detail"><div class="detail-header"><div class="detail-preview-heading"><span id="detailBadge"></span><button id="previewFullscreen" type="button" class="icon" aria-label="全屏预览" title="全屏预览" aria-pressed="false" data-icon="fullscreenEnter"></button><span id="fullscreenFilename"></span></div><kbd id="fullscreenHint" aria-hidden="true">Esc</kbd><div class="detail-nav"><span id="detailPosition"></span><button id="prevDetail" class="icon" aria-label="上一个资源" data-icon="back" data-i18n-aria-label="previousResource"></button><button id="nextDetail" class="icon" aria-label="下一个资源" data-icon="chevron" data-i18n-aria-label="nextResource"></button><button id="closeDetail" class="icon" aria-label="关闭详情" data-icon="close" data-i18n-aria-label="closeDetails"></button></div></div><div class="detail-layout"><div class="preview-column"><div id="preview"></div></div><aside class="detail-info"><div class="detail-summary-head">

<button id="starItem" type="button" class="icon" data-icon="star" data-i18n-aria-label="favorite" aria-pressed="false"></button>
<button id="privateItem" type="button" class="icon" data-icon="unlock" data-i18n-aria-label="privateStatus" aria-pressed="false"></button>
</div></div>
<div id="detailFilename" class="file-name">
 <div class="file-name-stem">
  <h2 id="detailName" tabindex="0" aria-keyshortcuts="F2"></h2>
  <form id="detailRename" class="file-name-editor" inert>
   <input id="detailNameInput" type="text" autocomplete="off" spellcheck="false" data-i18n-aria-label="renameFile" aria-label="重命名文件">
  </form>
 </div>
 <span class="file-name-suffix" aria-hidden="true"></span>
</div>
<p id="detailSubtitle" class="detail-summary" aria-label="图像概览" data-i18n-aria-label="imageOverview"></p>
<div class="detail-quick"><button id="exportItem" class="primary" data-i18n="export"><i data-icon="export"></i>导出</button><button id="trashItem" type="button" class="icon" data-icon="trash" data-i18n-aria-label="trashFile" data-i18n-title="trashFile" aria-haspopup="dialog"></button></div>
</div>
<div class="detail-section"><h3 data-i18n="fileLocation">文件位置</h3><p id="detailPath" class="file-path"></p><div class="path-actions"><button id="copyRelativePath" class="path-action" data-i18n="relativePathButton" aria-label="复制相对路径" title="复制相对路径" data-i18n-aria-label="copyRelativePath" data-i18n-title="copyRelativePath"><i data-icon="path"></i>相对路径</button><button id="copyAbsolutePath" class="path-action" data-i18n="absolutePathButton" aria-label="复制绝对路径" title="复制绝对路径" data-i18n-aria-label="copyAbsolutePath" data-i18n-title="copyAbsolutePath"><i data-icon="copy"></i>绝对路径</button><button id="reveal" class="path-action" data-i18n="finderButton" aria-label="Finder 中打开" title="Finder 中打开" data-i18n-aria-label="openInFinder" data-i18n-title="openInFinder"><i data-icon="folderOpen"></i>Finder</button></div></div>
<section class="detail-section tag-section" aria-labelledby="detailTagsTitle">
 <h3 id="detailTagsTitle" data-i18n="tags">标签</h3>
 <div id="tagEditor"></div>
</section>
<div id="detailHistogram" class="detail-section histogram-section" hidden></div>
<div class="detail-section"><h3 data-i18n="fileInformation">文件信息</h3><div id="metadata"></div></div>
<div id="detailConversation" class="detail-section" hidden><h3 id="detailLocationLabel" data-i18n="conversationLabel">所属会话</h3><button id="detailContact" class="contact-link"></button></div>
</aside></div></dialog>
<dialog id="entryNameDialog" class="feature-dialog" aria-labelledby="entryNameTitle">
 <h2 id="entryNameTitle"></h2>
 <form id="entryNameForm">
  <div class="entry-name-input"><input id="entryNameInput" type="text" aria-label="名称" data-i18n-aria-label="entryName" autocomplete="off" required autofocus><span id="entryNameSuffix"></span></div>
  <p id="entryNameError" class="feature-error" role="alert"></p>
  <div class="feature-dialog-footer">
   <button id="entryNameCancel" type="button" data-i18n="cancel">取消</button>
   <button id="entryNameSubmit" type="submit" class="primary"></button>
  </div>
 </form>
</dialog>
<dialog id="trashDialog" class="feature-dialog trash-dialog" aria-labelledby="trashTitle" aria-describedby="trashFilename trashDescription">
 <h2 id="trashTitle" data-i18n="trashFile">删除文件</h2>
 <p id="trashFilename"></p>
 <p id="trashDescription" class="feature-subtitle" data-i18n="trashFileDescription">文件会从原位置移入废纸篓，可在废纸篓中恢复。</p>

 <form method="dialog" class="feature-dialog-footer">
  <button id="cancelTrash" value="cancel" autofocus data-i18n="cancel">取消</button>
  <button id="confirmTrash" type="button" class="trash-confirm" data-i18n="moveToTrash">移入废纸篓</button>

</dialog>
<dialog id="vaultDialog" class="feature-dialog vault-dialog" aria-labelledby="vaultTitle">
 <header class="feature-dialog-header"><div><h2 id="vaultTitle"></h2><p class="feature-subtitle"></p></div><button class="icon" data-pin-cancel data-icon="close" data-i18n-aria-label="closeDialog"></button></header>
 <form class="pin-form"><p id="pinHint"></p><div class="pin-fields"></div><p id="pinError" class="pin-error feature-error" role="alert"></p><footer class="feature-dialog-footer"><button type="button" data-pin-cancel data-i18n="cancel">取消</button><button type="submit" class="primary"></button></footer></form>
</dialog><div id="toast" popover="manual"></div><script type="module" src="app.js"></script></body></html>
