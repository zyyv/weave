<main><header class="topbar"><button id="expand" class="icon" aria-label="展开侧栏" title="展开侧栏" data-icon="sidebar" data-i18n-aria-label="expandSidebar" data-i18n-title="expandSidebar"></button><div class="breadcrumb"><button id="homeCrumb" data-i18n="resourceLibrary">资源库</button><i data-icon="chevron"></i><span id="crumb" data-i18n="allResources">全部资源</span></div><span class="top-right" data-i18n="localLibrary"><span id="freshness" data-i18n="scanningLabel">正在扫描</span><span class="local-dot"></span> 本机资源库</span></header>
