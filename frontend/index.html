<!doctype html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Weave · 微信资源库</title><link id="__media-styles" rel="stylesheet" href="vendor/videojs/global.css"><link rel="stylesheet" href="style.css"></head><body>
<div id="sidebarShade"></div><aside id="sidebar"><div class="sidebar-inner"><div class="window-space"></div><div class="sidebar-tools"><span class="brand"><svg viewBox="0 0 32 32"><path d="M5 10 16 4l11 6v12l-11 6L5 22V10Zm0 0 22 12M27 10 5 22M16 4v24"/></svg>Weave</span><div class="history-controls" role="group" aria-label="页面导航"><button id="navigateBack" class="icon" aria-label="后退" aria-keyshortcuts="Meta+[" title="后退 ⌘ [" data-icon="arrowLeft" disabled></button><button id="navigateForward" class="icon" aria-label="前进" aria-keyshortcuts="Meta+]" title="前进 ⌘ ]" data-icon="arrowRight" disabled></button></div><button id="collapse" class="icon" aria-label="收起侧栏" title="收起侧栏" data-icon="sidebar"></button></div><button class="source" id="choose"><i data-icon="folder"></i><span>微信资源库<small>MessageTemp</small></span><i data-icon="chevron"></i></button>
<nav id="nav"><button data-kind="" class="active"><i data-icon="grid"></i>全部资源</button><button data-kind="image"><i data-icon="image"></i>图片</button><button data-kind="video"><i data-icon="video"></i>视频</button><button data-kind="audio"><i data-icon="audio"></i>语音与音频</button><button data-kind="document"><i data-icon="file"></i>文档</button><button data-kind="other"><i data-icon="box"></i>其他文件</button><button id="stars"><i data-icon="star"></i>我的收藏</button></nav>
<div class="storage-section"><div class="side-heading">本地资源空间</div><div id="storage"><strong>—</strong><span>等待扫描</span><div id="typebar"></div></div><div id="breakdown"></div></div>
<div class="side-bottom"><button id="refresh"><i data-icon="refresh"></i>重新扫描</button><button id="settingsButton"><i data-icon="settings"></i>设置<span>⌘ ,</span></button><div class="local"><i data-icon="lock"></i><span>仅在本机处理<small>你的资源，留在你的电脑</small></span></div></div></div></aside>
<main><header class="topbar"><button id="expand" class="icon" aria-label="展开侧栏" title="展开侧栏" data-icon="sidebar"></button><div class="breadcrumb"><button id="homeCrumb">微信资源库</button><i data-icon="chevron"></i><span id="crumb">全部资源</span></div><span class="top-right"><span id="freshness">正在扫描</span><span class="local-dot"></span> 本机资源库</span></header>
<section id="libraryPage"><div class="toolbar"><div class="heading"><div><h1 id="title">全部资源</h1><p id="summary">正在读取本地资源…</p></div><button id="export" class="primary"><i data-icon="export"></i>导出所选</button></div><div class="search"><i data-icon="search"></i><input id="search" aria-label="搜索资源或联系人" placeholder="搜索资源、标签或会话名称"><kbd>⌘ K</kbd></div><div class="filters"><button id="backScope" hidden><i data-icon="back"></i>全部会话</button><select id="group" aria-label="筛选会话目录"><option value="">所有会话</option></select><select id="sort" aria-label="排序"><option value="date">最近修改</option><option value="size">文件从大到小</option><option value="name">名称排序</option></select><button id="scopeToggle" class="scope-toggle" aria-pressed="true"><i data-icon="layers"></i><span>按会话分组</span></button><label class="thumb-label"><input id="thumbs" type="checkbox">缩略图</label><div class="view-controls"><button id="gridView" class="icon active" title="网格视图" aria-label="网格视图" data-icon="grid"></button><button id="listView" class="icon" title="列表视图" aria-label="列表视图" data-icon="list"></button></div></div><div id="scopeFilters" class="scope-filters" role="group" aria-label="会话资源类型，可多选" hidden><button data-scope-kind="" aria-pressed="true">全部类型</button><button data-scope-kind="image" aria-pressed="false">图片</button><button data-scope-kind="video" aria-pressed="false">视频</button><button data-scope-kind="audio" aria-pressed="false">音频</button><button data-scope-kind="document" aria-pressed="false">文档</button><button data-scope-kind="other" aria-pressed="false">其他</button><span>可多选</span></div><div class="list-label"><span id="resultCount">资源</span><button id="bindScope" hidden><i data-icon="edit"></i>绑定会话</button><button id="selectAll">选择已加载</button><button id="clearSelection" hidden>取消选择</button><span id="selectionCount"></span></div></div>
<div class="resources-scroll" id="resourceScroll"><div id="notice" role="status"></div><div id="items" aria-live="polite"></div><div id="empty" hidden><i data-icon="search"></i><h2>没有匹配的资源</h2><p>试试其他关键词，或更改筛选条件。</p><button id="reset">清除筛选</button></div><button id="loadState" class="load-state" aria-live="polite"></button></div></section>
<section id="settingsPage" hidden><div class="settings-top"><h1>设置</h1><span id="settingsState" role="status">更改会自动保存</span></div><div class="settings-layout"><nav id="settingsNav"><button data-section="general" class="active">通用</button><button data-section="appearance">外观</button><button data-section="playback">播放器</button><button data-section="bindings">会话绑定</button><button data-section="data">数据与存储</button></nav><div id="settingsContent"></div></div></section></main>
<dialog id="detail"><div class="detail-header"><span id="detailBadge"></span><div class="detail-nav"><button id="prevDetail" class="icon" aria-label="上一个资源" data-icon="back"></button><button id="nextDetail" class="icon" aria-label="下一个资源" data-icon="chevron"></button><button id="closeDetail" class="icon" aria-label="关闭详情" data-icon="close"></button></div></div><div class="detail-layout"><div class="preview-column"><div id="preview"></div><div class="preview-caption"><span id="detailPosition"></span><span>原始文件 · 本地预览</span></div></div><aside class="detail-info"><div id="detailType"></div><h2 id="detailName"></h2><p id="detailSubtitle"></p><div class="detail-quick"><button id="starItem"><i data-icon="star"></i>收藏</button><button id="exportItem" class="primary"><i data-icon="export"></i>导出</button></div><div class="detail-section"><h3>所属会话</h3><button id="detailContact" class="contact-link"></button></div><div class="detail-section"><h3>文件信息</h3><dl id="metadata"></dl></div><div class="detail-section"><div class="section-line"><label for="tags">标签</label><button id="saveTags">保存</button></div><input id="tags" placeholder="工作, 灵感, 待整理"></div><div class="detail-section"><h3>文件位置</h3><p id="detailPath" class="file-path"></p><button id="reveal" class="text-action"><i data-icon="folder"></i>在 Finder 中显示</button></div></aside></div></dialog><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
